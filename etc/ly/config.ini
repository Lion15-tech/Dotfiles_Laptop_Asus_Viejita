# Ly admite color real de 24 bits con estilos, lo que significa que cada color es un valor de 32 bits.
# El formato es 0xSSRRGGBB, donde SS es el estilo, RR es rojo, GG es verde y BB es azul.
# Aquí están las posibles opciones de estilo:
# TB_BOLD        0x01000000
# TB_UNDERLINE   0x02000000
# TB_REVERSE     0x04000000
# TB_ITALIC      0x08000000
# TB_BLINK       0x10000000
# TB_HI_BLACK    0x20000000
# TB_BRIGHT      0x40000000
# TB_DIM         0x80000000
# Tenga en cuenta que si desea utilizar el valor de color predeterminado de la terminal, puede utilizar
# el valor especial 0x00000000. Esto significa que si desea utilizar negro, *debe* utilizar
# la opción de estilo TB_HI_BLACK (los valores RGB se ignoran al utilizar esta opción).

# Permitir contraseña vacía o no al autenticarse
allow_empty_password = true

# La animación activa
# none       -> Ninguna
# doom       -> Fuego de PSX DOOM
# matrix     -> CMatrix (Lluvia Matrix)
# colormix   -> Mezclador de colores
# gameoflife -> Juego de la vida de John Conway
# dur_file   -> Formato de archivo .dur
animation = matrix

# Retraso entre cada fotograma de animación en milisegundos
animation_frame_delay = 5

# Detener la animación después de cierto tiempo
# 0 -> Ejecutar para siempre
# 1..2e12 -> Detener la animación después de esta cantidad de segundos
animation_timeout_sec = 0

# El carácter utilizado para enmascarar la contraseña
# Puede escribirlo directamente como un carácter UTF-8 (como *), o usar un punto de código UTF-32
# (por ejemplo, 0x2022 para una viñeta)
# Si es null, la contraseña permanecerá oculta
# Nota: puede usar un # escapándolo así: \#
asterisk = *

# El número de autenticaciones fallidas antes de reproducir una animación especial... ;)
# Si se establece en 0, la animación nunca se reproducirá
auth_fails = 10

# Identificador de la batería cuya carga se mostrará en la parte superior izquierda
# La batería principal suele ser BAT0 o BAT1
# Si se establece en null, no se mostrará el estado de la batería
battery_id = BAT0

# Configuración de inicio de sesión automático
# Esta función permite a Ly iniciar sesión automáticamente a un usuario sin solicitar contraseña.
# IMPORTANTE: Tanto auto_login_user como auto_login_session deben configurarse para que esto funcione.
# El inicio de sesión automático solo ocurre una vez al arrancar, no se volverá a activar tras cerrar sesión.

# Nombre del servicio PAM que se utilizará para el inicio de sesión automático
# El servicio predeterminado (ly-autologin) usa pam_permit para permitir el inicio de sesión sin contraseña
# La configuración de PAM adecuada para la plataforma (ly-autologin) se utilizará automáticamente
auto_login_service = ly-autologin

# Nombre de la sesión que se iniciará automáticamente
# Para encontrar los nombres de sesión disponibles, revise los archivos .desktop en:
#   - /usr/share/xsessions/ (para sesiones X11)
#   - /usr/share/wayland-sessions/ (para sesiones Wayland)
# Use el nombre del archivo sin la extensión .desktop, el campo Name dentro del archivo o el valor de DesktopNames
# Ejemplos: "i3", "sway", "gnome", "plasma", "xfce"
# Si es null, el inicio de sesión automático está desactivado
auto_login_session = null

# Nombre de usuario para el inicio de sesión automático
# Debe ser un usuario válido en el sistema
# Si es null, el inicio de sesión automático está desactivado
auto_login_user = null

# ID de color de fondo
bg = 0x00000000

# Cambiar el estado e idioma del reloj gigante
# none -> Desactivado (predeterminado)
# en   -> Inglés
# fa   -> Farsi
bigclock = en

# Establecer el reloj gigante en notación de 12 horas.
bigclock_12hr = true

# Establecer el reloj gigante para mostrar los segundos.
bigclock_seconds = true

# Fondo del cuadro principal en blanco/sólido
# Establecerlo en false lo hará transparente
blank_box = true

# ID de color frontal del borde (Rosa Neón #FF0055)
border_fg = 0x00FF0055

# Título que se mostrará en la parte superior del cuadro principal
# Si se establece en null, no se mostrará ninguno
box_title = ARCH CYBERPUNK

# Comando para disminuir el brillo
brightness_down_cmd = /usr/bin/brightnessctl -q -n s 10%-

# Combinación de teclas para disminuir el brillo, o null para desactivar
brightness_down_key = F5

# Comando para aumentar el brillo
brightness_up_cmd = /usr/bin/brightnessctl -q -n s +10%

# Combinación de teclas para aumentar el brillo, o null para desactivar
brightness_up_key = F6

# Borrar la entrada de contraseña si falla la autenticación
clear_password = false

# Cadena de formato para el reloj en la esquina superior derecha (ver especificación de strftime). Ejemplo: %c
# Si es null, no se mostrará el reloj
clock = null

# ID de color frontal de la animación CMatrix (Verde Neón #00FF66)
cmatrix_fg = 0x0000FF66

# ID de color de la cabeza del carácter de la animación CMatrix (Rosa Neón #FF0055)
cmatrix_head_col = 0x00FF0055

# Punto de código mínimo para la animación CMatrix. Usa un entero de 16 bits
# Para caracteres japoneses por ejemplo, puede usar 0x3000 aquí
cmatrix_min_codepoint = 0x21

# Punto de código máximo para la animación CMatrix. Usa un entero de 16 bits
# Para caracteres japoneses por ejemplo, puede usar 0x30FF aquí
cmatrix_max_codepoint = 0x7B

# ID del primer color para la animación de mezcla de colores (colormix)
colormix_col1 = 0x00FF0000

# ID del segundo color para la animación de mezcla de colores (colormix)
colormix_col2 = 0x000000FF

# ID del tercer color para la animación de mezcla de colores (colormix)
colormix_col3 = 0x20000000

# Para vinculaciones personalizadas: el límite horizontal en caracteres para cada
# línea de vinculaciones personalizadas antes de pasar a la siguiente.
# Si es null, se ajusta al ancho de la terminal.
custom_bind_width = null

# Directorio de sesiones personalizadas
# Puede especificar múltiples directorios,
# ej. /etc/ly/custom-sessions:/usr/share/custom-sessions
custom_sessions = /etc/ly/custom-sessions

# Caja de entrada activa por defecto al iniciar
# Entradas disponibles: info_line, session, login, password
default_input = login

# Altura del fuego en la animación DOOM (1 a 9)
doom_fire_height = 6

# Propagación del fuego en la animación DOOM (0 a 4)
doom_fire_spread = 2

# Color superior personalizado para la animación DOOM (llamas de baja intensidad)
doom_top_color = 0x009F2707

# Color medio personalizado para la animación DOOM (llamas de intensidad media)
doom_middle_color = 0x00C78F17

# Color inferior personalizado para la animación DOOM (llamas de alta intensidad)
doom_bottom_color = 0x00FFFFFF

# Ruta del archivo .dur
dur_file_path = /etc/ly/example.dur

# El archivo dur se puede alinear con una dirección y centrar fácilmente con las opciones a continuación
# Entradas disponibles: topleft, topcenter, topright, centerleft, center, centerright, bottomleft, bottomcenter, bottomright
dur_offset_alignment = center

# Dirección x del desplazamiento dur (el valor se suma a la posición actual determinada por la alineación, se admiten negativos)
dur_x_offset = 0

# Dirección y del desplazamiento dur (el valor se suma a la posición actual determinada por la alineación, se admiten negativos)
dur_y_offset = 0

# Establecer margen en los bordes del gestor de inicio (útil para monitores curvos)
edge_margin = 0

# ID de color de fondo de error
error_bg = 0x00000000

# ID de color frontal de error
# El predeterminado es rojo y negrita
error_fg = 0x01FF0000

# ID de color frontal / Texto principal (Cian Neón #00F0FF)
fg = 0x0000F0FF

# Renderizar colores reales de 24 bits (si está soportado)
# Si es false, la salida será en modo de ocho colores
# Todos los códigos de color en modo de ocho colores:
# TB_DEFAULT    0x0000
# TB_BLACK      0x0001
# TB_RED        0x0002
# TB_GREEN      0x0003
# TB_YELLOW     0x0004
# TB_BLUE       0x0005
# TB_MAGENTA    0x0006
# TB_CYAN       0x0007
# TB_WHITE      0x0008
# Si el color completo está desactivado, las opciones de estilo aún funcionan. Los colores son
# siempre valores de 32 bits con el estilo en el byte más significativo.
# Nota: Si se utiliza la opción de animación dur_file y el rango de color del archivo dur
# se guarda como 256 con esta opción desactivada, el archivo no se dibujará.
full_color = true

# Intervalo de entropía del Juego de la vida (0 = desactivado, >0 = agregar entropía cada N generaciones)
# 0 -> Juego de la vida puro de Conway (eventualmente se estabilizará)
# 10 -> Agregar entropía cada 10 generaciones (recomendado para actividad continua)
# 50+ -> Entropía menos frecuente para una evolución más natural
gameoflife_entropy_interval = 10

# ID de color frontal para la animación del Juego de la vida
gameoflife_fg = 0x0000FF00

# Retraso de fotogramas del Juego de la vida (menor = animación más rápida, mayor = más lenta)
# 1-3 -> Animación muy rápida
# 6 -> Velocidad de animación suave predeterminada
# 10+ -> Velocidad más lenta y contemplativa
gameoflife_frame_delay = 6

# Densidad celular inicial del Juego de la vida (0.0 a 1.0)
# 0.1 -> Dispersa, actividad mínima
# 0.4 -> Actividad balanceada (recomendado)
# 0.7+ -> Densa, patrones caóticos
gameoflife_initial_density = 0.4

# Comando ejecutado al presionar la tecla de hibernar (puede ser null)
hibernate_cmd = null

# Especifica la combinación de teclas utilizada para hibernar
hibernate_key = F4

# Eliminar los bordes del cuadro principal
hide_borders = false

# Eliminar las sugerencias de comandos de gestión de energía
hide_key_hints = false

# Eliminar los estados de bloqueo del teclado en la esquina superior derecha
hide_keyboard_locks = false

# Eliminar el número de versión de la esquina superior izquierda
hide_version_string = false

# Comando ejecutado cuando no se detecta entrada durante cierto tiempo
# Si es null, no se ejecutará ningún comando
inactivity_cmd = null

# Ejecuta un comando después de una cierta cantidad de segundos
inactivity_delay = 0

# Texto inicial para mostrar en la línea de información
# Si se establece en null, la línea de información toma por defecto el nombre del host
initial_info_text = null

# Longitud de las cajas de entrada
input_len = 34

# Idioma activo
# Los idiomas disponibles se encuentran en /etc/ly/lang/
lang = en

# Comando ejecutado al iniciar sesión
# Si es null, no se ejecutará ningún comando
# ¡Importante: el código debe terminar con `exec "$@"` para lanzar la sesión!
# ¡También puede configurar variables de entorno allí, persistirán hasta cerrar sesión!
login_cmd = null

# Ruta del archivo login.defs (usado para listar todos los usuarios locales del sistema en Linux)
login_defs_path = /etc/login.defs

# Comando ejecutado al cerrar sesión
# Si es null, no se ejecutará ningún comando
# ¡Importante: la sesión ya habrá finalizado cuando se ejecute este comando, por lo que no es necesario agregar `exec "$@"` al final!
logout_cmd = null

# Ruta del archivo de registro general
ly_log = /var/log/ly.log

# Margen horizontal del cuadro principal
margin_box_h = 2

# Margen vertical del cuadro principal
margin_box_v = 1

# Establecer BloqNum activado/desactivado al iniciar
numlock = false

# Ruta predeterminada
# Si es null, ly no establece una ruta
path = /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

# Comando ejecutado al presionar restart_key
restart_cmd = /sbin/shutdown -r now

# Especifica la combinación de teclas utilizada para reiniciar
restart_key = F2

# Guardar el escritorio e inicio de sesión actuales como predeterminados y cargarlos al iniciar
save = true

# Nombre del servicio (establecido en ly para usar el archivo de configuración pam proporcionado)
service_name = ly

# Ruta del archivo de registro de sesión
# Esto contendrá stdout y stderr de las sesiones de Wayland
# Por defecto se guarda en el directorio de inicio del usuario
# Importante: debido a limitaciones técnicas, las sesiones X11, shell y KMSCON no son soportadas,
# lo que significa que no obtendrá registros de esas sesiones.
# Si es null, no se creará ningún registro de sesión
session_log = .local/state/ly-session.log

# Comando de configuración
setup_cmd = /etc/ly/setup.sh

# Mostrar la sesión shell en la lista de sesiones
# Si es false, la sesión shell estará oculta
shell = true

# Especifica la combinación de teclas utilizada para mostrar la contraseña
show_password_key = F7

# Mostrar el número de TTY activa (ej. tty3) a la derecha del reloj en la esquina superior derecha
# Si el reloj está desactivado, la etiqueta de TTY ocupa la esquina superior derecha por sí sola
# Si es false, el número de TTY no se mostrará
show_tty = false

# Comando ejecutado al presionar shutdown_key
shutdown_cmd = /sbin/shutdown -a now

# Especifica la combinación de teclas utilizada para apagar
shutdown_key = F1

# Comando ejecutado al presionar la tecla de suspensión (puede ser null)
sleep_cmd = null

# Especifica la combinación de teclas utilizada para suspensión
sleep_key = F3

# Comando ejecutado al iniciar Ly (antes de tomar control de la TTY)
# Consulte el archivo en la ruta siguiente para ver un ejemplo de cambio de colores TTY predeterminados
start_cmd = /etc/ly/startup.sh

# Centrar el nombre de la sesión
text_in_center = false

# Modo vi predeterminado
# normal -> modo normal
# insert -> modo inserción
vi_default_mode = normal

# Habilitar vinculaciones de teclas vi
vi_mode = false

# Directorios de escritorios Wayland
# Puede especificar múltiples directorios,
# ej. /usr/share/wayland-sessions:/usr/local/share/wayland-sessions
# Si es null, las sesiones Wayland no se mostrarán
waylandsessions = /usr/share/wayland-sessions

# Comando del servidor Xorg
# Agregue el argumento -quiet para ocultar los registros de inicio del servidor
x_cmd = /usr/bin/X

# Número de terminal virtual Xorg
# Principalmente útil para FreeBSD donde elegir la TTY actual causa problemas
# Si es null, se elegirá la TTY actual
x_vt = null

# Herramienta de edición xauthority de Xorg
xauth_cmd = /usr/bin/xauth

# xinitrc
# Si es null, la sesión xinitrc estará oculta
xinitrc = ~/.xinitrc

# Directorios de escritorios Xorg
# Puede especificar múltiples directorios,
# ej. /usr/share/xsessions:/usr/local/share/xsessions
# Si es null, las sesiones X11 no se mostrarán
xsessions = /usr/share/xsessions

# Comandos y etiquetas personalizados:
# Los siguientes ejemplos a continuación brindan un esquema para configurar comandos y etiquetas personalizados.
# A menos que se especifique como opcional, una opción es obligatoria.

# Los comentarios que preceden con '##' son para documentación.
# Los comentarios que preceden con '#' comentan el INI de ejemplo.

## Declarar un comando con la vinculación F8.
#[cmd:F8]
## El nombre del comando que se mostrará en Ly.
## Nota: "$" en "$brightness_up" obtiene la cadena correspondiente del archivo de idioma especificado
## y se reemplaza con el valor que representa "brightness_up".
## Puede ver la lista de claves en cualquier archivo de idioma en /etc/ly/lang/.
#cmd = touch /tmp/ly.gaming
#name = custom command $brightness_up

## Declarar una etiqueta con un ID. Este ID debe ser único entre todas las etiquetas.
#[lbl:kernel]
#cmd = uname -srn
## Opcional, por defecto es 0.
## En fotogramas, el tiempo para volver a ejecutar el comando y actualizar la etiqueta.
## Si es 0, solo se ejecuta una vez y no se actualiza después
#refresh = 0
